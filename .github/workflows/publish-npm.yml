name: Publish package to npm

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify tag matches package version
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          package_version="$(node -p "require('./package.json').version")"

          if [ "$tag_version" != "$package_version" ]; then
            echo "Tag $tag_version does not match package.json version $package_version"
            exit 1
          fi

      - name: Lint
        run: npm run lint

      - name: Test and build
        run: npm test

      - name: Publish to npm
        # The workflow already ran lint and build. Skip the local-only release
        # guard so this tag-based job can perform the actual publish.
        # Configure npm Trusted Publishing for this exact filename:
        # owner: arturdemorais, repository: n8n-nodes-pipefacil,
        # workflow: publish-npm.yml. Leave NPM_TOKEN unset for OIDC;
        # an existing granular token can still be used as a fallback.
        run: npm publish --ignore-scripts --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
